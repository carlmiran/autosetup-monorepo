# AUTOSETUP — docker/docker-compose.dev.yml
# Ambiente de desenvolvimento local. Sobe só o Postgres — o resto (apps/workers)
# roda via `pnpm dev` diretamente, fora de container, nesta fase (EBK 0.1).
#
# Uso:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: autosetup-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: autosetup
      POSTGRES_PASSWORD: autosetup_dev_only
      POSTGRES_DB: autosetup_dev
    ports:
      - "5432:5432"
    volumes:
      - autosetup_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosetup -d autosetup_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  autosetup_postgres_dev_data:
